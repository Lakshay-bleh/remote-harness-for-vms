# Builds the Android app and publishes it as a GitHub release, so it can be done from the GitHub mobile app:
# Actions → "Android APK" → Run workflow → enter a version (for example 1.5).
name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the v (for example 1.5)'
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          v="${v#v}"
          case "$v" in (*[!0-9A-Za-z._-]*|'') echo "bad version"; exit 1;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Monotonic across releases, and above the 4 that the early builds shipped with.
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Push notifications: Firebase's app config comes from a repository secret, never from git. Without the secret the APK still
      # builds; it just cannot receive push (the google-services plugin is only applied when the file exists).
      - name: Add the Firebase app config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > packages/web/android/app/google-services.json
            echo "Firebase config added: push notifications will work in this build."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set: this APK will not receive push notifications."
          fi

      # Play Protect distrusts debuggable apps signed with a throwaway debug key, and every machine's debug key differs (so an update
      # will not install over the last one). With the signing secrets set, the APK is a release build signed with the app's own key.
      - name: Add the signing key
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > "$RUNNER_TEMP/signing.properties"
            echo "props=$RUNNER_TEMP/signing.properties" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "script=android:apk:release" >> "$GITHUB_OUTPUT"
            echo "apk=release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: this is a debug-signed APK (kept as a build artifact only, never published to the release)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "props=$RUNNER_TEMP/none.properties" >> "$GITHUB_OUTPUT"
            echo "script=android:apk" >> "$GITHUB_OUTPUT"
            echo "apk=debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        working-directory: packages/web
        env:
          RH_VERSION_NAME: ${{ steps.v.outputs.version }}
          RH_VERSION_CODE: ${{ steps.v.outputs.code }}
          RH_SIGNING_PROPERTIES: ${{ steps.sign.outputs.props }}
        run: npm run ${{ steps.sign.outputs.script }}

      - name: Name the file
        run: cp packages/web/android/app/build/outputs/apk/${{ steps.sign.outputs.apk }} "remote-harness-${{ steps.v.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: remote-harness-${{ steps.v.outputs.version }}-apk
          path: remote-harness-${{ steps.v.outputs.version }}.apk

      # Only a release-signed APK goes on the release page. A debug build would replace the signed one attached by hand (same file
      # name) and users could no longer update over it.
      - name: Publish the release
        if: steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Remote Harness ${{ steps.v.outputs.version }} (Android)
          generate_release_notes: true
          files: remote-harness-${{ steps.v.outputs.version }}.apk
