# Builds the Android app and publishes it as a GitHub release, so it can be done from the GitHub mobile app:
# Actions → "Android APK" → Run workflow → enter a version (for example 1.5).
name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the v (for example 1.5)'
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          v="${v#v}"
          case "$v" in (*[!0-9A-Za-z._-]*|'') echo "bad version"; exit 1;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build the debug APK
        working-directory: packages/web
        run: npm run android:apk

      - name: Name the file
        run: cp packages/web/android/app/build/outputs/apk/debug/app-debug.apk "remote-harness-${{ steps.v.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: remote-harness-${{ steps.v.outputs.version }}-apk
          path: remote-harness-${{ steps.v.outputs.version }}.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Remote Harness ${{ steps.v.outputs.version }} (Android)
          generate_release_notes: true
          files: remote-harness-${{ steps.v.outputs.version }}.apk
