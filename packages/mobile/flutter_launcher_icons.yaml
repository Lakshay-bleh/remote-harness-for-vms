# The app icon (dart run flutter_launcher_icons). Sources: assets/images/icon-*.png (1024 x 1024).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/icon-only.png"
  adaptive_icon_background: "assets/images/icon-background.png"
  adaptive_icon_foreground: "assets/images/icon-foreground.png"
  remove_alpha_ios: true
  background_color_ios: "#050505"
  min_sdk_android: 24
